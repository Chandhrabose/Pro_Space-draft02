<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Games</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  body {
    margin: 0;
    background: #0b0b0b;
    color: white;
    font-family: system-ui, sans-serif;
  }

  h1 {
    text-align: center;
    padding: 20px;
    color: orange;
  }

  .section {
    padding: 20px;
  }

  /* 6 x 6 GRID */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 18px;
  }

  .game-card {
    background: #111;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .game-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 16px rgba(255, 140, 0, 0.75);
  }

  .game-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
  }

  .game-card p {
    margin: 0;
    padding: 10px;
    font-size: 14px;
    text-align: center;
  }

  .game-card::after {
    content: "View Game";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.65);
    color: orange;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .game-card:hover::after {
    opacity: 1;
  }

  .pagination {
    margin: 35px 0;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .pagination button {
    background: black;
    color: orange;
    border: 1px solid orange;
    padding: 7px 14px;
    cursor: pointer;
    border-radius: 8px;
    font-size: 14px;
  }

  .pagination button.active {
    background: orange;
    color: black;
  }

  @media (max-width: 1200px) {
    .games-grid { grid-template-columns: repeat(4, 1fr); }
  }

  @media (max-width: 700px) {
    .games-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

<body>

<h1>🎮 Popular Games This Month</h1>

<div class="section">
  <div id="gamesGrid" class="games-grid"></div>

  <div class="pagination">
    <button id="prevPage">◀</button>
    <div id="pageNumbers"></div>
    <button id="nextPage">▶</button>
  </div>
</div>

<script>
  const API_KEY = "YOUR_RAWG_API_KEY";
  const PAGE_SIZE = 36; // 6 x 6
  let currentPage = 1;
  const TOTAL_PAGES = 20;

  const gamesGrid = document.getElementById("gamesGrid");
  const pageNumbers = document.getElementById("pageNumbers");

  async function fetchGames(page) {
    gamesGrid.innerHTML = "Loading...";
    const url = `https://api.rawg.io/api/games?key=${"14e17d1d6cad4ed494e61815981ccfef"}&ordering=-added&page=${page}&page_size=${PAGE_SIZE}`;
    const res = await fetch(url);
    const data = await res.json();
    renderGames(data.results);
  }

  function renderGames(games) {
    gamesGrid.innerHTML = "";
    games.forEach(game => {
      const card = document.createElement("div");
      card.className = "game-card";

      card.onclick = () => {
        window.open(`https://rawg.io/games/${game.slug}`, "_blank");
      };

      card.innerHTML = `
        <img src="${game.background_image || ''}">
        <p>${game.name}</p>
      `;

      gamesGrid.appendChild(card);
    });
  }

  function renderPagination() {
    pageNumbers.innerHTML = "";
    for (let i = 1; i <= TOTAL_PAGES; i++) {
      const btn = document.createElement("button");
      btn.textContent = i;
      if (i === currentPage) btn.classList.add("active");

      btn.onclick = () => {
        currentPage = i;
        fetchGames(currentPage);
        renderPagination();
      };
      pageNumbers.appendChild(btn);
    }
  }

  document.getElementById("prevPage").onclick = () => {
    if (currentPage > 1) {
      currentPage--;
      fetchGames(currentPage);
      renderPagination();
    }
  };

  document.getElementById("nextPage").onclick = () => {
    if (currentPage < TOTAL_PAGES) {
      currentPage++;
      fetchGames(currentPage);
      renderPagination();
    }
  };

  fetchGames(currentPage);
  renderPagination();
</script>

</body>
</html>
